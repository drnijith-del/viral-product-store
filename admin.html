<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instahype - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; color: #000; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { background: #000; color: #fff; padding: 30px 20px; border-radius: 8px; margin-bottom: 30px; }
        .header h1 { font-size: 28px; font-weight: 800; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.8; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 8px; border-left: 4px solid #000; }
        .stat-value { font-size: 28px; font-weight: 800; }
        .stat-label { font-size: 13px; color: #999; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 700; transition: background 0.2s; }
        .btn-primary { background: #000; color: #fff; }
        .btn-primary:hover { background: #333; }
        .btn-secondary { background: #ddd; color: #000; }
        .btn-secondary:hover { background: #ccc; }
        .btn-danger { background: #d32f2f; color: #fff; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-back { background: #f5f5f5; color: #000; border: 1px solid #ddd; }
        .btn-back:hover { background: #eee; }
        
        .table-container { background: #fff; border-radius: 8px; overflow: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f5f5f5; padding: 12px; text-align: left; font-weight: 700; border-bottom: 2px solid #e0e0e0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 12px; border-bottom: 1px solid #e0e0e0; font-size: 13px; }
        tr:hover { background: #fafafa; }
        
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-completed { background: #d4edda; color: #155724; }
        .status-failed { background: #f8d7da; color: #721c24; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: #fff; padding: 30px; border-radius: 10px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
        .modal-header { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
        .detail-item { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #e0e0e0; }
        .detail-label { font-size: 11px; color: #999; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .detail-value { font-size: 15px; margin-top: 5px; font-weight: 600; }
        .close-btn { float: right; cursor: pointer; font-size: 28px; font-weight: bold; color: #999; }
        .close-btn:hover { color: #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 instahype Admin Dashboard</h1>
        <p>Manage and track all customer orders</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="totalOrders">0</div>
            <div class="stat-label">Total Orders</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="completedOrders">0</div>
            <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="pendingOrders">0</div>
            <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalRevenue">₹0</div>
            <div class="stat-label">Total Revenue</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" onclick="loadOrders()">🔄 Refresh</button>
        <button class="btn btn-primary" onclick="exportToCSV()">📥 Export CSV</button>
        <button class="btn btn-danger" onclick="clearAllData()">🗑️ Clear Data</button>
        <button class="btn btn-back" onclick="window.location.href='index.html'">← Back to Store</button>
    </div>

    <div class="table-container">
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ordersBody">
            </tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">
            <p>No orders yet. Start selling! 🚀</p>
        </div>
    </div>
</div>

<!-- Order Details Modal -->
<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeDetailsModal()">&times;</span>
        <div class="modal-header">Order Details</div>
        <div id="orderDetails"></div>
        <button class="btn btn-secondary" onclick="closeDetailsModal()" style="width: 100%; margin-top: 20px;">Close</button>
    </div>
</div>

<script>
function loadOrders() {
    const orders = JSON.parse(localStorage.getItem('instashop_orders') || '[]');
    updateStats(orders);
    displayOrders(orders);
}

function updateStats(orders) {
    const completed = orders.filter(o => o.status === 'completed').length;
    const pending = orders.filter(o => o.status === 'pending').length;
    const revenue = orders.filter(o => o.status === 'completed').reduce((sum, o) => sum + (o.price || 0), 0);

    document.getElementById('totalOrders').innerText = orders.length;
    document.getElementById('completedOrders').innerText = completed;
    document.getElementById('pendingOrders').innerText = pending;
    document.getElementById('totalRevenue').innerText = '₹' + revenue.toLocaleString('en-IN');
}

function displayOrders(orders) {
    const tbody = document.getElementById('ordersBody');
    const emptyState = document.getElementById('emptyState');

    if (orders.length === 0) {
        tbody.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }

    emptyState.style.display = 'none';
    tbody.innerHTML = orders.map((order, index) => `
        <tr>
            <td><strong>#${String(index + 1).padStart(5, '0')}</strong></td>
            <td>${order.name || '-'}</td>
            <td>${order.phone || '-'}</td>
            <td>${order.productName || '-'}</td>
            <td>₹${order.price || 0}</td>
            <td>
                <span class="status-badge status-${order.status || 'pending'}">
                    ${order.status === 'completed' ? '✓ Completed' : order.status === 'failed' ? '✗ Failed' : '⏳ Pending'}
                </span>
            </td>
            <td>${new Date(order.timestamp).toLocaleDateString('en-IN')}</td>
            <td>
                <button class="btn btn-secondary" onclick="viewOrderDetails(${index})">View</button>
            </td>
        </tr>
    `).join('');
}

function viewOrderDetails(index) {
    const orders = JSON.parse(localStorage.getItem('instashop_orders') || '[]');
    const order = orders[index];
    
    const detailsHtml = `
        <div class="detail-item">
            <div class="detail-label">Order ID</div>
            <div class="detail-value">#${String(index + 1).padStart(5, '0')}</div>
        </div>
        <div class="detail-item">
            <div class="detail-label">Customer Name</div>
            <div class="detail-value">${order.name}</div>
        </div>
        <div class="detail-item">
            <div class="detail-label">Phone</div>
            <div class="detail-value">${order.phone}</div>
        </div>
        <div class="detail-item">
            <div class="detail-label">Email</div>
            <div class="detail-value">${order.email || 'Not provided'}</div>
        </div>
        <div class="detail-item">
            <div class="detail-label">Address</div>
            <div class="detail-value">${order.address}</div>
        </div>
        <div class="detail-item">
            <div class="detail-label">Product</div>
            <div class="detail-value">${order.productName}</div>
        </div>
        <div class="detail-item">
            <div class="detail-label">Price</div>
            <div class="detail-value">₹${order.price}</div>
        </div>
        <div class="detail-item">
            <div class="detail-label">Payment ID</div>
            <div class="detail-value">${order.paymentId || 'Pending'}</div>
        </div>
        <div class="detail-item">
            <div class="detail-label">Status</div>
            <div class="detail-value">
                <span class="status-badge status-${order.status}">
                    ${order.status === 'completed' ? '✓ Completed' : order.status === 'failed' ? '✗ Failed' : '⏳ Pending'}
                </span>
            </div>
        </div>
        <div class="detail-item">
            <div class="detail-label">Date & Time</div>
            <div class="detail-value">${new Date(order.timestamp).toLocaleString('en-IN')}</div>
        </div>
    `;
    
    document.getElementById('orderDetails').innerHTML = detailsHtml;
    document.getElementById('detailsModal').classList.add('show');
}

function closeDetailsModal() {
    document.getElementById('detailsModal').classList.remove('show');
}

function exportToCSV() {
    const orders = JSON.parse(localStorage.getItem('instashop_orders') || '[]');
    if (orders.length === 0) {
        alert('No orders to export');
        return;
    }

    const headers = ['Order ID', 'Name', 'Phone', 'Email', 'Product', 'Price', 'Address', 'Status', 'Payment ID', 'Date'];
    const rows = orders.map((order, index) => [
        '#' + String(index + 1).padStart(5, '0'),
        order.name,
        order.phone,
        order.email,
        order.productName,
        order.price,
        order.address,
        order.status,
        order.paymentId || '-',
        new Date(order.timestamp).toLocaleString('en-IN')
    ]);

    let csv = headers.join(',') + '\n';
    rows.forEach(row => {
        csv += row.map(cell => '"' + (cell ? cell.toString().replace(/"/g, '""') : '') + '"').join(',') + '\n';
    });

    const link = document.createElement('a');
    link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    link.download = 'instashop_orders_' + new Date().toISOString().split('T')[0] + '.csv';
    link.click();
}

function clearAllData() {
    if (confirm('⚠️ Are you sure? This cannot be undone!')) {
        localStorage.removeItem('instashop_orders');
        loadOrders();
        alert('All data cleared');
    }
}

window.onclick = function(event) {
    const modal = document.getElementById('detailsModal');
    if (event.target == modal) closeDetailsModal();
}

window.addEventListener('load', loadOrders);
setInterval(loadOrders, 5000);
</script>

</body>
</html>
